<form (submit)="onSubmit($event)">
  <div class="modal-header">
    <div class="modal-title-row">
      <div class="modal-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#4fd1c5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 7h13l-3.5-3.5"/>
          <path d="M20 3.5V8"/>
          <path d="M17 17H4l3.5 3.5"/>
          <path d="M4 20.5V16"/>
        </svg>
      </div>
      <div>
        <h2 class="modal-title">Transférer de l'argent</h2>
        <p class="modal-subtitle">Déplacez des fonds entre vos comptes</p>
      </div>
    </div>
    <button type="button" mat-dialog-close class="btn-close" aria-label="Fermer">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <mat-dialog-content>
    <div class="form-body">

      <div class="transfer-columns">
        <div class="transfer-column">
          <label class="label">Compte source</label>
          <div class="account-list">
            @for (account of accounts(); track account.id) {
              <button type="button" class="account-option" [class.selected]="originAccount()?.id === account.id"
                [disabled]="targetAccount()?.id === account.id" (click)="selectOrigin(account)">
                @if (originAccount()?.id === account.id) {
                  <span class="account-check">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="20 6 9 17 4 12" />
                    </svg>
                  </span>
                }
                <img class="account-logo" [src]="'data:image/png;base64,' + account.logo" [alt]="account.label" />
                <span class="account-name">{{ account.label }}</span>
                <span class="account-balance">{{ account.amount | number: '1.2-2':'fr-FR' }} €</span>
              </button>
            }
          </div>
        </div>

        <div class="transfer-arrow">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none"
            stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="12" x2="20" y2="12" />
            <polyline points="14 6 20 12 14 18" />
          </svg>
        </div>

        <div class="transfer-column">
          <label class="label">Compte destinataire</label>
          <div class="account-list">
            @for (account of accounts(); track account.id) {
              <button type="button" class="account-option" [class.selected]="targetAccount()?.id === account.id"
                [disabled]="originAccount()?.id === account.id" (click)="selectTarget(account)">
                @if (targetAccount()?.id === account.id) {
                  <span class="account-check">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="20 6 9 17 4 12" />
                    </svg>
                  </span>
                }
                <img class="account-logo" [src]="'data:image/png;base64,' + account.logo" [alt]="account.label" />
                <span class="account-name">{{ account.label }}</span>
                <span class="account-balance">{{ account.amount | number: '1.2-2':'fr-FR' }} €</span>
              </button>
            }
          </div>
        </div>
      </div>

      <div class="input-group">
        <label class="label">Montant à transférer</label>
        <div class="amount-wrapper">
          <span class="currency">€</span>
          <input class="input amount-input" type="text" inputmode="decimal" autocomplete="off"
            [value]="amount() || ''" (input)="updateAmount($any($event.target).value)" placeholder="0.00" />
        </div>
      </div>

      @if (exceedsBalance()) {
        <p class="field-error">Le montant dépasse le solde disponible sur le compte source.</p>
      }

    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="modal-actions">
    <button type="button" mat-dialog-close class="btn btn-cancel">Annuler</button>
    <button type="submit" class="btn btn-submit" [disabled]="!canSubmit()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 7h13l-3.5-3.5"/>
        <path d="M20 3.5V8"/>
        <path d="M17 17H4l3.5 3.5"/>
        <path d="M4 20.5V16"/>
      </svg>
      Transférer
    </button>
  </mat-dialog-actions>
</form>
