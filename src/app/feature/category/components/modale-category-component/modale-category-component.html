<form (submit)="onSubmit($event)">
  <div class="modal-header">
    <div class="modal-title-row">
      <div class="modal-icon">
        @if (selectedIcon()) {
          <mat-icon class="modal-icon-glyph" [fontIcon]="selectedIcon()!"></mat-icon>
        } @else {
          <mat-icon class="modal-icon-glyph" fontIcon="category"></mat-icon>
        }
      </div>
      <div>
        <h2 class="modal-title">Nouvelle catégorie</h2>
        <p class="modal-subtitle">Créer une catégorie personnalisée</p>
      </div>
    </div>
    <button type="button" mat-dialog-close class="btn-close" aria-label="Fermer">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
  </div>

  <mat-dialog-content>
    <div class="form-body">

      <div class="input-group">
        <label class="label">Nom de la catégorie</label>
        <input
          class="input"
          type="text"
          autocomplete="off"
          placeholder="Ex : Restaurant, Transport..."
          [value]="name()"
          (input)="name.set($any($event.target).value)" />
      </div>

      <div class="input-group">
        <label class="label">Icône</label>

        <div class="icon-search-wrapper">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            class="icon-search-input"
            type="text"
            placeholder="Rechercher une icône..."
            [value]="iconSearch()"
            (input)="iconSearch.set($any($event.target).value)" />
        </div>

        <div class="icon-grid">
          @for (icon of filteredIcons(); track icon) {
            <button
              type="button"
              class="icon-option"
              [class.selected]="selectedIcon() === icon"
              [title]="icon"
              (click)="selectIcon(icon)">
              <mat-icon [fontIcon]="icon"></mat-icon>
            </button>
          } @empty {
            <p class="icon-empty">Aucune icône trouvée</p>
          }
        </div>
      </div>

    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="modal-actions">
    <button type="button" mat-dialog-close class="btn btn-cancel">Annuler</button>
    <button type="submit" class="btn btn-submit">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      Créer la catégorie
    </button>
  </mat-dialog-actions>
</form>
