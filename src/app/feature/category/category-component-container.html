<div class="category-page">

  <div class="page-header">
    <div>
      <h2 class="page-title">Catégories</h2>
      <p class="page-subtitle">{{store.categoriesCount()}} catégorie{{store.categoriesCount() > 1 ? 's' : ''}} pour organiser vos dépenses</p>
    </div>
    <div class="header-actions">
      <button (click)="openCreateCategoryModal()" class="btn-create">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        Nouvelle catégorie
      </button>
    </div>
  </div>

  @if (store.categoriesCount() > 0) {
    <div class="chip-list">
      @for (category of store.categories(); track category.id) {
        <div class="category-chip">
          <span class="chip-icon">
            <mat-icon class="chip-icon-size" [fontIcon]="category.icon"></mat-icon>
          </span>
          <span class="chip-name">{{category.name}}</span>
          <span class="chip-actions">
            <button class="chip-action chip-edit" title="Modifier">
              <mat-icon fontIcon="edit"/>
            </button>
            <button class="chip-action chip-delete" title="Supprimer">
              <mat-icon fontIcon="delete"/>
            </button>
          </span>
        </div>
      }
    </div>
  } @else {
    <div class="empty-state">
      <mat-icon class="empty-icon" fontIcon="category"/>
      <p class="empty-text">Aucune catégorie pour le moment</p>
      <button (click)="openCreateCategoryModal()" class="btn-empty-create">Créer votre première catégorie</button>
    </div>
  }
</div>
